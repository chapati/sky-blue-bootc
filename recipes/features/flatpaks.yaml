name: sublime
description: Manage flatpaks

modules:
  - type: flatpak
    install:
      - md.obsidian.Obsidian
      - org.telegram.desktop
      - com.mongodb.Compass
      - com.bitwarden.desktop
      - eu.betterbird.Betterbird
      - app.grayjay.Grayjay
      - org.cockpit_project.CockpitClient
      - de.haeckerfelix.Shortwave
    remove:
      - org.mozilla.Thunderbird
      - com.github.tchx84.Flatseal
      - com.github.PintaProject.Pinta
      - org.gnome.Calculator
      - org.gnome.Calendar
      - org.gnome.Characters
      - org.gnome.Connections
      - org.gnome.Contacts
      - org.gnome.DejaDup
      - org.gnome.FileRoller
      - org.gnome.Firmware
      - org.gnome.Logs
      - org.gnome.Loupe
      - org.gnome.Maps
      - org.gnome.NautilusPreviewer
      - org.gnome.Papers
      - org.gnome.Showtime
      - org.gnome.SimpleScan
      - org.gnome.Snapshot
      - org.gnome.TextEditor
      - org.gnome.Weather
      - org.gnome.baobab
      - org.gnome.clocks
      - org.gnome.font-viewer

  - type: dnf
    install:
      - flatseal
      - pinta
      - foliate
      - g4music
      - gnome-calculator
      - gnome-calendar
      - gnome-characters
      - gnome-contacts
      - deja-dup
      - file-roller
      - gnome-firmware
      - gnome-logs
      - loupe
      - sushi
      - papers-previewer
      - snapshot
      - gnome-text-editor
      - baobab
      - gnome-font-viewer
      - gnome-weather
