name: packages
description: Install common cli-tools & utilities

modules:
  - type: dnf
    install:
      - bpftop
      - cascadia-code-fonts
      - htop
      - iotop
      - libvirt
      - libvirt-nss
      - mc
      - nicstat
      - numactl
      - podman-compose
      - podman-machine
      - podman-tui
      - qemu
      - qemu-char-spice
      - qemu-device-display-virtio-gpu
      - qemu-device-display-virtio-vga
      - qemu-device-usb-redirect
      - qemu-img
      - qemu-system-x86-core
      - qemu-user-binfmt
      - qemu-user-static
      - sysprof
      - incus
      - incus-agent
      - lxc
      - tiptop
      - trace-cmd
      - udica
      - util-linux-script
      - virt-manager
      - virt-viewer
      - ydotool

