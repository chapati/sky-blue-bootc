name: packages
description: Install common cli-tools & utilities

modules:
  - type: dnf
    repos:
      - vivaldi.repo
    install:
      - mc
      - vivaldi-stable
      - clapper
      - strace
      - flatseal
      - g4music
      - foliate
      - gnome-font-viewer
      - gnome-firmware
      - gnome-logs
      - gnome-calculator
      - gnome-calendar
      - gnome-characters
      - gnome-contacts
      - gnome-weather
      - gnome-clocks
      - loupe
      - sushi
      - gnome-text-editor
      - file-roller
      - papers-previewer
      - baobab
      - ignition
    remove:
      - tailscale
      - yubikey-manager

  - type: flatpak
    remove:
      - com.github.tchx84.Flatseal
      - org.gnome.Showtime
      - org.mozilla.Thunderbird
      - org.gnome.font-viewer
      - org.gnome.Firmware
      - org.gnome.Logs
      - org.gnome.Calculator
      - org.gnome.Calendar
      - org.gnome.Maps
      - org.gnome.Characters
      - org.gnome.Contacts
      - org.gnome.Connections
      - org.gnome.Loupe
      - org.gnome.NautilusPreviewer
      - org.gnome.DejaDup
      - org.gnome.TextEditor
      - org.gnome.FileRoller
      - org.gnome.Papers
      - org.gnome.Snapshot
      - org.gnome.baobab
      - org.gnome.SimpleScan
      - org.gnome.Weather
      - org.gnome.clocks
      - com.mattjakeman.ExtensionManager
      - io.github.flattool.Ignition
    install:
      - md.obsidian.Obsidian
      - org.telegram.desktop
      - com.mongodb.Compass
      - com.bitwarden.desktop
      - eu.betterbird.Betterbird
      - app.grayjay.Grayjay
      - org.cockpit_project.CockpitClient
      - de.haeckerfelix.Shortwave

  #
  # System & dev tools
  #
  - type: dnf
    install:
      - xlsclients
      - xwininfo
      - sysstat
      - iostat

  #
  # Lean virtualization (x86 only)
  #
  - type: dnf
    install:
      - libvirt-daemon-kvm
      - virt-manager
      - gnome-boxes
      - edk2-ovmf
      - swtpm
      - swtpm-tools
      - gdisk

    remove:
      - virtualbox-guest-additions
      - open-vm-tools
      - open-vm-tools-desktop
      - hyperv-daemons
      - hyperv-daemons-license
      - hypervfcopyd
      - hypervkvpd
      - hypervvssd
