name: Branding
description: Apply SkyBlue branding

modules:
  - type: script
    snippets:
      - |
        # overwrite ublue-os motd
        cp -aT /usr/share/sblue/motd /usr/share/ublue-os/motd

        IMAGE_INFO="/usr/share/ublue-os/image-info.json"
        IMAGE_REF="ostree-image-signed:docker://ghcr.io/$IMAGE_VENDOR/$IMAGE_NAME"
        FEDORA_MAJOR_VERSION=$(rpm -E %fedora)

        if [ "${DEV_MODE:-false}" = "true" ] || [ "$IMAGE_VENDOR" = "local-dev" ]; then
          IMAGE_REF="ostree-unverified-registry:docker://localhost:5000/$IMAGE_NAME"
        else
          IMAGE_REF="ostree-image-signed:docker://ghcr.io/$IMAGE_VENDOR/$IMAGE_NAME"
        fi

        cat >$IMAGE_INFO <<EOF
        {
          "image-name":      "$IMAGE_NAME",
          "image-flavor":    "$IMAGE_FLAVOR",
          "image-vendor":    "$IMAGE_VENDOR",
          "image-ref":       "$IMAGE_REF",
          "image-tag":       "$IMAGE_TAG",
          "base-image-name": "$BASE_IMAGE_NAME",
          "fedora-version":  "$FEDORA_MAJOR_VERSION"
        }
        EOF
