name: firefox
description: Firefox as a native package

modules:
  - type: flatpak
    remove:
      - org.mozilla.firefox

  - type: dnf
    install:
      - firefox

  - type: script
    snippets: |
      mkdir -p /usr/lib64/firefox/distribution
      ln -sf /usr/share/sblue/firefox/policies.json /usr/lib64/firefox/distribution/policies.json
