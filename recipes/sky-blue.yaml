name: sky-blue-nvidia-open
description: Build SkyBlue linux

modules:
  - type: files
    copy:
      - source: system
        target: /

  - type: service
    register:
      - name: sblue-system-setup
        scope: system
      - name: sblue-system-online
        scope: system
      - name: sblue-user-setup
        scope: user
  
  - include: features/pakages.yaml
  - include: features/google-chrome.yaml
  - include: features/firefox.yaml
  - include: features/firefox-dev.yaml
  - include: features/sublime.yaml
  - include: features/ui.yaml
  - include: features/flatpaks.yaml
  - include: features/docker.yaml