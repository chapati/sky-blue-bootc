name: ui
description: UI & cosmetic stuff

modules:
  - type: fonts
    fonts:
      - folder: NF-InconsolataLGC
        url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/InconsolataLGC.zip

      - folder: NF-JetBrainsMono
        url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/JetBrainsMono.zip

  - type: dconf
    distro.d:
      - key: /org/gnome/desktop/interface/monospace-font-name
        type: string
        value: JetBrainsMono Nerd Font 12

