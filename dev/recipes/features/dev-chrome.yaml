name: dev-chrome
description: Chrome browser setup

modules:
  - type: tmpfiles
    system: |
      # Create the managed policy directory
      d /etc/opt/chrome/policies/recommended 0755 root root -
      d /etc/opt/chrome/policies/managed     0755 root root -

      # Link policy JSON from immutable /usr tree to /etc on boot
      L+ /etc/opt/chrome/policies/recommended/sblue-recommended.json - - - - /usr/share/sblue/chrome/recommended.json
      L+ /etc/opt/chrome/policies/managed/sblue-managed.json         - - - - /usr/share/sblue/chrome/managed.json
