name: ptyxis
description: Ptyxis setup

modules:
  - type: script
    snippets:
      - |
        sed -i --follow-symlinks '/^Primary=true$/d' /etc/skel/.local/share/org.gnome.Ptyxis/palettes/catppuccin-dynamic.palette

  - type: dconf
    distro.d:
      # 2871e8027773ae74d6c87a5f659bbc74 is the hardcoded default profile in bluefin
      - key: /org/gnome/Ptyxis/Profiles/2871e8027773ae74d6c87a5f659bbc74/palette
        type: string
        value: sky-blue-dynamic

  - type: tmpfiles
    system: |
      d  /etc/skel/.local/share/org.gnome.Ptyxis/palettes 0755 root root -
      L+ /etc/skel/.local/share/org.gnome.Ptyxis/palettes/sky-blue-dynamic.palette - - - - /usr/share/sblue/ptyxis/sky-blue-dracula.palette

  - type: script
    snippets: |
      cat << 'EOF' >> /etc/zshrc

      # Dynamic terminfo keybindings for ZLE
      if [[ -o zle && "$TERM" != "dumb" ]]; then
        zmodload zsh/terminfo 2>/dev/null

        typeset -g -A key
        key[Home]="${terminfo[khome]}"
        key[End]="${terminfo[kend]}"
        key[Insert]="${terminfo[kich1]}"
        key[Delete]="${terminfo[kdch1]}"
        key[Up]="${terminfo[kcuu1]}"
        key[Down]="${terminfo[kcud1]}"
        key[Left]="${terminfo[kcub1]}"
        key[Right]="${terminfo[kcuf1]}"
        key[PageUp]="${terminfo[kpp]}"
        key[PageDown]="${terminfo[knp]}"

        [[ -n "${key[Home]}"     ]] && bindkey -- "${key[Home]}"     beginning-of-line
        [[ -n "${key[End]}"      ]] && bindkey -- "${key[End]}"      end-of-line
        [[ -n "${key[Insert]}"   ]] && bindkey -- "${key[Insert]}"   overwrite-mode
        [[ -n "${key[Delete]}"   ]] && bindkey -- "${key[Delete]}"   delete-char
        [[ -n "${key[Up]}"       ]] && bindkey -- "${key[Up]}"       up-line-or-history
        [[ -n "${key[Down]}"     ]] && bindkey -- "${key[Down]}"     down-line-or-history
        [[ -n "${key[Left]}"     ]] && bindkey -- "${key[Left]}"     backward-char
        [[ -n "${key[Right]}"    ]] && bindkey -- "${key[Right]}"    forward-char
        [[ -n "${key[PageUp]}"   ]] && bindkey -- "${key[PageUp]}"   beginning-of-buffer-or-history
        [[ -n "${key[PageDown]}" ]] && bindkey -- "${key[PageDown]}" end-of-buffer-or-history

        # Switch terminal to application keypad mode during ZLE line editing
        if (( ${+terminfo[smkx]} )) && (( ${+terminfo[rmkx]} )); then
          function zle-line-init () { echoti smkx }
          function zle-line-finish () { echoti rmkx }
          zle -N zle-line-init
          zle -N zle-line-finish
        fi
      fi
      EOF