name: Build container image
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/TODO.md"
      - "**/cheatsheet.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/TODO.md"
      - "**/cheatsheet.md"
  schedule:
    # 07:00 UTC every saturday, 1h 20min after last ublue images start building
    - cron: "00 07 * * SAT"
  workflow_dispatch:

env:
  IMAGE_DESC:        "SkyBlue Linux"
  IMAGE_KEYWORDS:    "bootc,ublue,universal-blue,sblue,skyblue"
  IMAGE_LOGO_URL:    "https://avatars.githubusercontent.com/chapati?s=200&v=4"
  IMAGE_NAME:        "sky-blue-nvidia-open"
  IMAGE_FLAVOR:      "nvidia-open"
  IMAGE_REGISTRY:    "ghcr.io/${{github.repository_owner}}"
  DEFAULT_TAG:       "latest"
  BASE_IMAGE_NAME:   "bluefin-nvidia-open"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify_status:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [build_push, sign_image]
    # 'always()' ensures this job runs even if a dependency failed
    if: ${{ always() && github.ref_name == 'main' && github.event_name != 'pull_request' }}
    steps:
    - name: Send Telegram Notification
      env:
        TELEGRAM_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
        TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_BOT_CHAT_ID}}
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: |
        if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
          EMOJI="💢"
          STATUS="Failed"
        elif [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
          EMOJI="🖐️"
          STATUS="Cancelled"
        else
          EMOJI="🌱"
          STATUS="Succeeded"
        fi

        # Extract subject based on trigger event
        if [ "$EVENT_NAME" = "pull_request" ]; then
          RAW_TEXT="PR #${PR_NUM}: ${PR_TITLE}"
        elif [ "$EVENT_NAME" = "push" ]; then
          # Get first line of commit message
          RAW_TEXT=$(echo "$COMMIT_MSG" | head -n 1)
        elif [ "$EVENT_NAME" = "schedule" ]; then
          RAW_TEXT="Scheduled Weekly Build"
        else
          RAW_TEXT="Manual Run (${EVENT_NAME})"
        fi

        # Escape Telegram Markdown special characters in commit text to prevent 400 errors
        CLEAN_TEXT=$(echo "$RAW_TEXT" | sed -e 's/_/\\_/g' -e 's/\*/\\*/g' -e 's/`/\\`/g' -e 's/\[/\\[/g')

        LINES=(
          "${EMOJI} *SkyBlue OS Workflow ${STATUS}*"
          ""
          "*Repo:* ${{ github.repository }}"
          "*Ref:* ${{ github.ref_name }}"
          "*Msg:* ${CLEAN_TEXT}"
          "[View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        )
        MESSAGE=$(printf "%s\n" "${LINES[@]}")

        curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d link_preview_options='{"is_disabled": true}' \
          -d parse_mode="Markdown" \
          --data-urlencode "text=${MESSAGE}"

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      actions:  read
    outputs:
      digest: ${{steps.push.outputs.digest}}
    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Fetch Theme Lastest Commit
        id: theme_sha
        run: |
          SHA=$(git ls-remote https://github.com/chapati/graphite-gtk-theme.git HEAD | cut -f1)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v2
        with:
          containerfiles: |
            ./containerfile
          image:  ${{ env.IMAGE_NAME }}
          tags:   ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci:    false
          build-args: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_FLAVOR=${{ env.IMAGE_FLAVOR }}
            IMAGE_VENDOR=${{ github.repository_owner }}
            IMAGE_TAG=${{ env.DEFAULT_TAG }}
            BASE_IMAGE_NAME=${{ env.BASE_IMAGE_NAME }}
            THEME_COMMIT=${{ steps.theme_sha.outputs.sha }}

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work


      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

  sign_image:
    name: Sign Image
    runs-on: ubuntu-latest
    needs: [build_push]
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with Cosign
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}@${DIGEST}"
          chmod 644 ~/.docker/config.json
          podman run --rm \
            -v ~/.docker/config.json:/home/nonroot/.docker/config.json:ro \
            -e COSIGN_PRIVATE_KEY="${COSIGN_PRIVATE_KEY}" \
            -e COSIGN_PASSWORD="" \
            ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8 \
            sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE_FULL"
        env:
          DIGEST: ${{ needs.build_push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
